spring.application.name=movierizerapi

spring.datasource.url = jdbc:postgresql://db:5432/movierizer_db
spring.datasource.username = movierizer_user
spring.datasource.password = movierizer
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
# attention utile en production de remplacer update par validate
spring.jpa.hibernate.ddl-auto = update 
# permet d'afficher les commandes sql généré par hibernate
spring.jpa.show-sql=true