spring.application.name=movierizerapi

spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username =${POSTGRES_USER}
spring.datasource.password =${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
server.port=${BACK_SERVER_PORT}

spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
# attention utile en production de remplacer update par validate
spring.jpa.hibernate.ddl-auto = update 
# permet d'afficher les commandes sql généré par hibernate
spring.jpa.show-sql=true

security.jwt.secret-key=edc0c2ea99387d88f8bea095099ba9a90ac194796414375885c77d59ca850c68
security.jwt.expiration-time=3600000

logging.level.org.springframework.web=DEBUG
logging.level.root=INFO